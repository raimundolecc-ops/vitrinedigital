<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMarket | Meu Carrinho</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: "#006948", background: "#f5fbf5" }, fontFamily: { manrope: ["Manrope", "sans-serif"] } } }
        };
    </script>
</head>
<body data-page="carrinho" class="bg-background text-slate-900 min-h-screen flex flex-col font-manrope">

    <header class="bg-white border-b border-slate-200 py-4 px-6 mb-8">
        <div class="max-w-[1000px] mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 text-emerald-600">
                <span class="material-symbols-outlined text-3xl">arrow_back</span>
                <span class="text-xl font-extrabold">Continuar Comprando</span>
            </a>
            <h1 class="text-2xl font-bold">Meu Carrinho</h1>
        </div>
    </header>

    <main class="max-w-[1000px] mx-auto w-full px-6 flex-grow">
        <div id="cartContent" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div id="cartItemsList" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 sticky top-24">
                    <h2 class="text-lg font-bold mb-4">Resumo do Pedido</h2>
                    <div class="space-y-3 pb-4 border-b border-slate-100">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal</span>
                            <span id="subtotalValue">R$ 0,00</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>Entrega</span>
                            <span class="text-emerald-600 font-bold">Grátis</span>
                        </div>
                    </div>
                    <div class="flex justify-between py-4 text-xl font-extrabold">
                        <span>Total</span>
                        <span id="totalValue" class="text-emerald-700">R$ 0,00</span>
                    </div>
                    <button class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all active:scale-95 shadow-lg shadow-emerald-200">
                        Finalizar Pedido
                    </button>
                </div>
            </div>
        </div>

        <div id="emptyCart" class="hidden text-center py-20">
            <span class="material-symbols-outlined text-slate-200 text-8xl mb-4">shopping_cart_off</span>
            <h3 class="text-2xl font-bold text-slate-400">Seu carrinho está vazio</h3>
            <a href="index.html" class="inline-block mt-6 bg-emerald-600 text-white px-8 py-3 rounded-lg font-bold">Explorar Lojas</a>
        </div>
    </main>

    <script src="js/script.js"></script>

     <!--Acessibilidade-->
    
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div vw-plugin-top-wrapper></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
