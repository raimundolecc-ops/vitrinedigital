<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub Gestão | Catálogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="catalogo">
    <div class="app-shell">
        <aside class="sidebar">
            <a href="dashboard.html" class="brand">
                <span class="brand-icon-small material-symbols-outlined">dashboard</span>
                <div>
                    <strong>Hub Gestão</strong>
                    <small>Sistema neutro</small>
                </div>
            </a>

            <nav class="nav-list">
                <a href="dashboard.html" class="nav-link" data-nav="dashboard">
                    <span class="material-symbols-outlined">space_dashboard</span>
                    Painel
                </a>
                <a href="cadastro.html" class="nav-link" data-nav="cadastro">
                    <span class="material-symbols-outlined">add_box</span>
                    Cadastro
                </a>
                <a href="catalogo.html" class="nav-link" data-nav="catalogo">
                    <span class="material-symbols-outlined">view_module</span>
                    Catálogo
                </a>
                <a href="pedidos.html" class="nav-link" data-nav="pedidos">
                    <span class="material-symbols-outlined">receipt_long</span>
                    Pedidos
                </a>
                <a href="admin.html" class="nav-link" data-nav="admin">
                    <span class="material-symbols-outlined">admin_panel_settings</span>
                    Administração
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <small>Logado como</small>
                    <strong data-user-name>Visitante</strong>
                    <span data-user-role>visitante</span>
                </div>
                <button class="btn btn-outline-danger w-100" data-logout>
                    <span class="material-symbols-outlined">logout</span>
                    Sair
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Catálogo</h1>
                    <p>Visualização pública dos registros ativos.</p>
                </div>

                <div class="cart-pill">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    Lista: <strong data-cart-count>0</strong>
                </div>
            </header>

            <section class="catalog-controls">
                <input type="search" id="catalogSearch" class="form-control" placeholder="Buscar no catálogo...">

                <select id="catalogCategory" class="form-select">
                    <option value="Todos">Todas as categorias</option>
                </select>

                <select id="catalogSort" class="form-select">
                    <option value="recent">Mais recentes</option>
                    <option value="name">Nome</option>
                    <option value="priceAsc">Menor valor</option>
                    <option value="priceDesc">Maior valor</option>
                </select>
            </section>

            <section id="catalogGrid" class="catalog-grid"></section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

     <!--Acessibilidade-->
    
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div vw-plugin-top-wrapper></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

    <!--Classe de Alto Contraste-->
    <div class="fixed bottom-24 left-8 z-50 flex flex-col gap-2">
        <button onclick="toggleContrast()" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Alto Contraste">
            <span class="material-symbols-outlined">contrast</span>
        </button>
        <button onclick="changeFontSize(1)" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Aumentar Fonte">
            <span class="material-symbols-outlined">text_increase</span>
        </button>
        <button onclick="changeFontSize(-1)" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Diminuir Fonte">
            <span class="material-symbols-outlined">text_decrease</span>
        </button>
    </div>
</body>

</html>
