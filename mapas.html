<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMarket | Mapas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="mapas" class="bg-[#f5fbf5] font-manrope min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-[1200px] mx-auto px-6 h-20 flex items-center justify-between gap-8">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-200">
                    <span class="material-symbols-outlined">map</span>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900">Local<span class="text-emerald-600">Market</span></span>
            </a>
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                    <input type="text" placeholder="Buscar lojas no mapa..." class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-emerald-500 transition-all">
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="login.html" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition-all shadow-md">Entrar</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-[1200px] mx-auto w-full p-6">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Lojas Próximas</h1>
            <p class="text-slate-500">Encontre produtores locais ao seu redor.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-4 overflow-y-auto max-h-[600px] pr-2">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-emerald-500 transition-all cursor-pointer shadow-sm">
                    <h3 class="font-bold text-slate-900">Green Valley Orgânicos</h3>
                    <p class="text-sm text-slate-500">Rua das Flores, 123</p>
                    <span class="text-xs font-bold text-emerald-600">A 1.2km de você</span>
                </div>
                </div>

            <div class="lg:col-span-2 h-[600px] bg-slate-200 rounded-3xl overflow-hidden relative border-4 border-white shadow-xl">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center">
                        <span class="material-symbols-outlined text-slate-400 text-6xl">location_on</span>
                        <p class="text-slate-500 font-medium">O mapa será carregado aqui...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 mt-12 py-10">
        <div class="max-w-[1200px] mx-auto px-6 text-center">
            <p class="text-sm text-slate-500">© 2026 LocalMarket. Acessibilidade garantida com VLibras.</p>
        </div>
    </footer>

    <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div vw-plugin-top-wrapper></div></div></div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

    <div class="fixed bottom-24 left-8 z-50 flex flex-col gap-2">
        <button onclick="toggleContrast()" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Alto Contraste">
            <span class="material-symbols-outlined">contrast</span>
        </button>
        <button onclick="changeFontSize(1)" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Aumentar Fonte">
            <span class="material-symbols-outlined">text_increase</span>
        </button>
        <button onclick="changeFontSize(-1)" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-900 transition-all" title="Diminuir Fonte">
            <span class="material-symbols-outlined">text_decrease</span>
        </button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
