<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMarket | Ofertas do Dia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="ofertas" class="bg-[#f5fbf5] font-manrope min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-[1200px] mx-auto px-6 h-20 flex items-center justify-between gap-8">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <span class="material-symbols-outlined">sell</span>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-900">Local<span class="text-orange-500">Ofertas</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="carrinho.html" class="p-2 text-slate-600 hover:text-emerald-600 relative">
                    <span class="material-symbols-outlined text-3xl">shopping_cart</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-[1200px] mx-auto w-full p-6">
        <div class="bg-gradient-to-r from-orange-500 to-red-600 rounded-3xl p-8 mb-10 text-white shadow-xl">
            <h1 class="text-4xl font-extrabold mb-2">Ofertas Relâmpago ⚡</h1>
            <p class="opacity-90">Preços baixos dos produtores da sua região por tempo limitado.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all group">
                <div class="relative h-48 bg-slate-100">
                    <div class="absolute top-4 left-4 bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold">-20%</div>
                    <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=400" class="w-full h-full object-cover">
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-slate-900 mb-1">Cesta de Morangos</h3>
                    <div class="flex items-center gap-2">
                        <span class="text-lg font-extrabold text-emerald-600">R$ 12,00</span>
                        <span class="text-sm text-slate-400 line-through">R$ 15,00</span>
                    </div>
                    <button class="w-full mt-4 bg-slate-900 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-600 transition-all">Adicionar</button>
                </div>
            </div>
            </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-10 mt-12 text-center text-sm text-slate-500">
        © 2026 LocalMarket | Orgulho em apoiar o comércio local.
    </footer>

    <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div vw-plugin-top-wrapper></div></div></div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
    <script src="js/script.js"></script>
</body>
</html>
